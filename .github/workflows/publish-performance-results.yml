name: Isolated performance JSON publication check

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-performance-results.yml
  schedule:
    - cron: '17 23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: isolated-performance-publication
  cancel-in-progress: false

jobs:
  refresh-json:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout public results branch only
        uses: actions/checkout@v4
        with:
          ref: performance-json-data
          persist-credentials: true
      - name: Update publication check, not trading results
        run: python3 scripts/refresh_results_public.py
      - name: Commit changes only to isolated results branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add performance-data/results.json
          if git diff --cached --quiet; then
            echo 'No publication changes to commit'
          else
            git commit -m 'Refresh isolated performance JSON publication check'
            git push origin HEAD:performance-json-data
          fi
